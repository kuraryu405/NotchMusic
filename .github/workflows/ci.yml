name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14          # Apple Silicon runner, ships with Xcode 15+

    steps:
      - uses: actions/checkout@v4

      - name: Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build -c debug 2>&1 | xcpretty || swift build -c debug

      - name: Run tests
        run: swift test --parallel 2>&1 | xcpretty || swift test --parallel

      - name: Build (release)
        run: swift build -c release

  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
